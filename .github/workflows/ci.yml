name: CI

# 触发条件：推送到 main 分支，或对 main 的 Pull Request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Python 环境（带 pip 缓存加速）
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. 运行单元测试（物理内核四层验证）
      #    MPLBACKEND=Agg：CI 无显示器，强制 matplotlib 使用无头后端
      - name: Run pytest
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -v

      # 5. 重新生成全部图表（验证绘图链路 + 产出工件）
      - name: Regenerate figures
        env:
          MPLBACKEND: Agg
        run: |
          python src/generate_spectrum.py
          python src/generate_heatmap.py

      # 6. 把生成的图表上传为构建工件（PR 页面可直接下载查看）
      - name: Upload figures as artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: output/
          retention-days: 14
